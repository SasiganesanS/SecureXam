services:

  mysql:
    image: mysql:8.4
    container_name: securexam-mysql

    environment:
      MYSQL_ROOT_PASSWORD: Moon@123
      MYSQL_DATABASE: securexam

    ports:
      - "3307:3306"

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  app:
    build: .
    container_name: securexam-app

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "8080:8080"